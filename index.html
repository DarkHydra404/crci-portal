<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --crci-gold: #FBB03B; --crci-dark: #1a1a1a; }
        body { background: #fafafa; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 font-sans">
    <div class="fixed inset-0 pointer-events-none opacity-20 overflow-hidden">
        <div class="absolute top-10 left-10 text-8xl floating" style="animation-delay: 0s;">📚</div>
        <div class="absolute bottom-20 right-20 text-8xl floating" style="animation-delay: 1s;">🧪</div>
        <div class="absolute top-1/2 left-1/4 text-7xl floating" style="animation-delay: 2s;">✏️</div>
    </div>

    <div class="max-w-6xl mx-auto relative z-10">
        <header class="flex justify-between items-center mb-12 animate__animated animate__fadeInDown">
            <h1 class="text-3xl font-black tracking-tighter text-crci-dark">CRCi <span class="text-orange-500">INITIATIVE</span></h1>
            <div class="px-4 py-2 bg-green-100 text-green-700 rounded-full text-sm font-bold flex items-center gap-2">
                <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
                Automated Call Engine Active
            </div>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-3xl shadow-2xl">
                <h2 class="text-4xl font-bold mb-4">Morning Alerts</h2>
                <p class="text-gray-500 mb-8">System scans the database daily at 06:00 AM WAT to trigger deep-voice automated calls to facilitators.</p>
                
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-gray-100">
                        <span class="font-medium">Voice Profile</span>
                        <span class="text-orange-600 font-bold uppercase tracking-widest text-xs">Deep Male (Polly)</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-xl border-b-8 border-orange-500">
                <h3 class="text-xl font-bold mb-6">Log New Student</h3>
                <form class="space-y-4">
                    <input type="text" placeholder="Student Name" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-orange-500 outline-none">
                    <input type="date" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-orange-500 outline-none">
                    <button class="w-full bg-crci-dark text-white py-4 rounded-xl font-bold hover:bg-black transition">Save to Cloud Registry</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
